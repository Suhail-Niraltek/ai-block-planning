<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  [class]="size()"
  [attr.aria-hidden]="label() ? null : 'true'"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label()"
  [innerHTML]="paths()"
></svg>
