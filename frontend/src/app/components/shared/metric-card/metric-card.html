<div
  class="group h-full rounded-2xl border border-slate-200/80 bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-[0_10px_24px_rgba(15,23,42,0.06)] dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700"
>
  <div class="flex items-start justify-between gap-2">
    <dt class="text-xs leading-tight font-medium text-slate-500 dark:text-slate-400">
      {{ label() }}
    </dt>

    @if (icon()) {
      <span
        class="grid h-8 w-8 shrink-0 place-items-center rounded-lg transition group-hover:scale-105"
        [class]="iconClass(tone())"
      >
        <app-icon [name]="icon()!" size="h-4 w-4" />
      </span>
    }
  </div>

  <dd
    class="mt-3 text-[1.7rem] leading-none font-bold tracking-tight tabular-nums"
    [class]="valueClass(tone())"
  >
    {{ value() }}
  </dd>

  @if (hint()) {
    <p class="mt-1.5 text-xs leading-snug text-slate-500 dark:text-slate-400">{{ hint() }}</p>
  }
</div>
