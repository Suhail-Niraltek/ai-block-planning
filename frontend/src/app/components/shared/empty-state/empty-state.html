<div
  class="rounded-xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center dark:border-slate-700 dark:bg-slate-900/50"
>
  <span
    class="icon-frame mx-auto grid h-11 w-11 place-items-center rounded-xl bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500"
  >
    <app-icon [name]="icon()" size="h-5 w-5" />
  </span>

  <p class="mt-3 text-sm font-semibold text-slate-800 dark:text-slate-100">{{ title() }}</p>

  @if (message()) {
    <p class="mx-auto mt-1 max-w-md text-sm leading-relaxed text-slate-500 dark:text-slate-400">
      {{ message() }}
    </p>
  }

  <ng-content />
</div>
