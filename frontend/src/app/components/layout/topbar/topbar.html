<header
  class="sticky top-0 z-20 flex h-16 items-center justify-between gap-3 border-b border-slate-200/80 bg-white/85 px-4 backdrop-blur-xl sm:px-6 lg:px-8 dark:border-slate-800 dark:bg-slate-950/85"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      (click)="layout.toggleNav()"
      class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-rail-blue focus-visible:outline-none lg:hidden dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
      [attr.aria-label]="layout.navButtonLabel()"
      [attr.aria-expanded]="layout.navOpen()"
    >
      <app-icon [name]="layout.navOpen() ? 'x' : 'menu'" size="h-5 w-5" />
    </button>

    <div class="min-w-0">
      <p class="truncate text-sm font-semibold text-slate-800 dark:text-slate-100">
        Operations workspace
      </p>
      <p class="hidden truncate text-[11px] text-slate-500 sm:block dark:text-slate-400">
        Automatic block planning &middot; Ministry of Railways
      </p>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <span
      class="hidden items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-semibold ring-1 ring-inset sm:inline-flex"
      [class]="connection().classes"
      [title]="connection().detail"
    >
      <app-icon [name]="connection().icon" size="h-3.5 w-3.5" />
      {{ connection().label }}
    </span>

    <button
      type="button"
      (click)="theme.toggleTheme()"
      class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 focus-visible:ring-2 focus-visible:ring-rail-blue focus-visible:outline-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:text-white"
      [attr.aria-label]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="theme.isDarkMode()"
    >
      <app-icon [name]="theme.isDarkMode() ? 'sun' : 'moon'" size="h-4 w-4" />
    </button>
  </div>
</header>
